name: ci

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    name: build (jdk ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [ '25' ]

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Build and test
        run: mvn -B -ntp verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-jdk${{ matrix.java }}
          path: |
            **/target/surefire-reports/**
            **/target/site/jacoco/**
          retention-days: 7

  compat-gate:
    name: demo scan
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Package CLI
        run: mvn -B -ntp -pl sql-compat-cli -am -DskipTests package

      - name: Scan sample mappers (report only)
        run: |
          java -jar sql-compat-cli/target/sql-compat.jar check \
            -i sql-compat-samples/src/main/resources \
            -f md -o sql-compat-report.md

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: sql-compat-report
          path: sql-compat-report.md
          retention-days: 7
