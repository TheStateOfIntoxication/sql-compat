name: ci

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    name: build (jdk ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [ '25' ]

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Build and test
        # 双库集成测试在这里会被跳过：它需要下方 consistency job 的 service 容器。其余用例照常跑。
        run: mvn -B -ntp verify

      - name: Upload the CLI jar for the JDK 8 job
        uses: actions/upload-artifact@v4
        with:
          name: cli-jar
          path: sql-compat-cli/target/sql-compat.jar
          retention-days: 7

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-jdk${{ matrix.java }}
          path: |
            **/target/surefire-reports/**
            **/target/site/jacoco/**
          retention-days: 7

  compat-gate:
    name: static scan
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Package CLI
        run: mvn -B -ntp -pl sql-compat-cli -am -DskipTests package

      - name: Scan sample mappers
        run: |
          java -jar sql-compat-cli/target/sql-compat.jar check \
            -i sql-compat-samples/src/main/resources \
            -f md -o sql-compat-report.md

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: sql-compat-report
          path: sql-compat-report.md
          retention-days: 7

  jdk8-runtime:
    name: run on JDK 8
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      # 运行期兼容的看门狗：政企现场大量项目就跑在 JDK 8 上，
      # 插件与 CLI 的字节码一旦被谁顺手改成 11+，这里立刻红。
      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Download the CLI jar built on JDK 25
        uses: actions/download-artifact@v4
        with:
          name: cli-jar
          path: target

      - name: Scan the samples with JDK 8
        run: |
          set -eo pipefail
          java -version
          java -jar target/sql-compat.jar check -i sql-compat-samples/src/main/resources -f md -o jdk8-report.md
          # 用报告里的数字断言，不依赖控制台文案
          grep -q "| 25 | 50 |" jdk8-report.md
          echo "JDK 8 运行通过，且检出结果与基线一致"

  maven-plugin-smoke:
    name: maven plugin smoke
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Install the plugin into the local repository
        run: mvn -B -ntp -DskipTests install

      # 把 src/it 里的宿主工程复制出去，替换成当前版本后跑一次 verify。
      # 验证两件事：check goal 真的执行；logback.xml 没被当成 mapper。
      - name: Consume the plugin from the IT host project
        run: |
          set -euo pipefail
          VERSION=$(mvn -B -ntp -q help:evaluate -Dexpression=project.version -DforceStdout)
          rm -rf /tmp/it && cp -r sql-compat-maven-plugin/src/it /tmp/it
          sed -i "s/@project.version@/${VERSION}/" /tmp/it/pom.xml
          cd /tmp/it
          mvn -B -ntp verify | tee plugin.log
          grep -q "sql-compat：扫描" plugin.log
          if grep -q "logback.xml" plugin.log; then
            echo "logback.xml 被误当成 mapper"; exit 1
          fi
          test -f target/sql-compat/sql-compat-report.md
          echo "插件执行正常；logback.xml 已正确跳过；报告已生成"

  consistency:
    name: dual-database consistency
    runs-on: ubuntu-latest
    needs: build

    # 两个引擎都以 service 容器启动：runner 自带 Docker，开发者本机不需要装数据库。
    # 这正是双层设计的价值。
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: compat_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: compat_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      SQLCOMPAT_MYSQL_URL: jdbc:mysql://127.0.0.1:3306/compat_test?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SQLCOMPAT_MYSQL_USER: root
      SQLCOMPAT_MYSQL_PASSWORD: root
      SQLCOMPAT_PG_URL: jdbc:postgresql://127.0.0.1:5432/compat_test
      SQLCOMPAT_PG_USER: postgres
      SQLCOMPAT_PG_PASSWORD: postgres

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Package CLI
        run: mvn -B -ntp -pl sql-compat-cli -am -DskipTests package

      - name: Run consistency suite
        run: |
          java -jar sql-compat-cli/target/sql-compat.jar verify \
            -c sql-compat-verify/src/test/resources/verify/cases \
            -s sql-compat-verify/src/test/resources/verify/setup.sql \
            -o sql-compat-verify.md

      - name: Publish report to the job summary
        if: always()
        run: |
          if [ -f sql-compat-verify.md ]; then
            cat sql-compat-verify.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sql-compat-verify
          path: sql-compat-verify.md
          retention-days: 14
