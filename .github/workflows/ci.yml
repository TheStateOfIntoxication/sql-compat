name: ci

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    name: build (jdk ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [ '25' ]

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Build and test
        # The dual-database integration test is skipped here on purpose: it needs the service
        # containers from the `verify` job below. Everything else runs.
        run: mvn -B -ntp verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-jdk${{ matrix.java }}
          path: |
            **/target/surefire-reports/**
            **/target/site/jacoco/**
          retention-days: 7

  compat-gate:
    name: static scan
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Package CLI
        run: mvn -B -ntp -pl sql-compat-cli -am -DskipTests package

      - name: Scan sample mappers
        run: |
          java -jar sql-compat-cli/target/sql-compat.jar check \
            -i sql-compat-samples/src/main/resources \
            -f md -o sql-compat-report.md

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: sql-compat-report
          path: sql-compat-report.md
          retention-days: 7

  consistency:
    name: dual-database consistency
    runs-on: ubuntu-latest
    needs: build

    # Both engines run as service containers, so the runner provides the Docker the developer
    # machine does not need. This is the whole point of the two-layer design.
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: compat_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: compat_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      SQLCOMPAT_MYSQL_URL: jdbc:mysql://127.0.0.1:3306/compat_test?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SQLCOMPAT_MYSQL_USER: root
      SQLCOMPAT_MYSQL_PASSWORD: root
      SQLCOMPAT_PG_URL: jdbc:postgresql://127.0.0.1:5432/compat_test
      SQLCOMPAT_PG_USER: postgres
      SQLCOMPAT_PG_PASSWORD: postgres

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Package CLI
        run: mvn -B -ntp -pl sql-compat-cli -am -DskipTests package

      - name: Run consistency suite
        run: |
          java -jar sql-compat-cli/target/sql-compat.jar verify \
            -c sql-compat-verify/src/test/resources/verify/cases \
            -s sql-compat-verify/src/test/resources/verify/setup.sql \
            -o sql-compat-verify.md

      - name: Publish report to the job summary
        if: always()
        run: |
          if [ -f sql-compat-verify.md ]; then
            cat sql-compat-verify.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sql-compat-verify
          path: sql-compat-verify.md
          retention-days: 14
