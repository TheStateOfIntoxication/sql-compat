<svg xmlns="http://www.w3.org/2000/svg" width="880" height="404" viewBox="0 0 880 404" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <defs>
    <style>
      .bg { fill: #0d1117; }
      .bar { fill: #161b22; }
      .dot-r { fill: #ff5f56; }
      .dot-y { fill: #ffbd2e; }
      .dot-g { fill: #27c93f; }
      .title { fill: #7d8590; font-size: 12px; }
      .prompt { fill: #7ee787; font-size: 13.5px; }
      .cmd { fill: #e6edf3; font-size: 13.5px; }
      .out { fill: #adbac7; font-size: 13.5px; }
      .ok { fill: #7ee787; font-size: 13.5px; }
      .blocker { fill: #ff5c5c; font-size: 13.5px; font-weight: 700; }
      .major { fill: #ffb020; font-size: 13.5px; font-weight: 700; }
      .minor { fill: #4aa8ff; font-size: 13.5px; font-weight: 700; }
      .dim { fill: #6e7681; font-size: 13.5px; }
    </style>
  </defs>

  <rect class="bg" width="880" height="404" rx="10"/>
  <rect class="bar" width="880" height="30" rx="10"/>
  <rect class="bar" y="20" width="880" height="10"/>
  <circle class="dot-r" cx="20" cy="15" r="5.5"/>
  <circle class="dot-y" cx="40" cy="15" r="5.5"/>
  <circle class="dot-g" cx="60" cy="15" r="5.5"/>
  <text class="title" x="440" y="19" text-anchor="middle">sql-compat — bash</text>

  <text class="prompt" x="24" y="62">$</text>
  <text class="cmd" x="42" y="62">java -jar sql-compat.jar check -i ./mappers -o report.html</text>

  <text class="out" x="24" y="92">共扫描 <tspan fill="#e6edf3">25</tspan> 条语句，耗时 181 ms</text>
  <text class="out" x="24" y="114">问题 <tspan fill="#e6edf3">50</tspan> 个（<tspan class="blocker">blocker=19</tspan>  <tspan class="major">major=22</tspan>  <tspan class="minor">minor=9</tspan>  info=0）</text>
  <text class="out" x="24" y="136">报告已写入 .../report.html</text>

  <text class="prompt" x="24" y="170">$</text>
  <text class="cmd" x="42" y="170">java -jar sql-compat.jar verify -c ./cases -s ./setup.sql -o verify.md</text>

  <text class="ok" x="24" y="200">一致 17/20（85.0%），不一致 3，失败 0</text>
  <text class="out" x="24" y="222">报告已写入 .../verify.md</text>

  <line x1="24" y1="244" x2="856" y2="244" stroke="#21262d" stroke-width="1"/>

  <text class="dim" x="24" y="268">被静态规则检出的示例（R004 / R001）：</text>

  <text class="blocker" x="24" y="296">BLOCKER</text>
  <text class="dim" x="98" y="296">R004  LIMIT offset, size 需改为 LIMIT size OFFSET offset</text>
  <text class="out" x="40" y="316">命中：<tspan fill="#e6edf3">LIMIT 10, 20</tspan></text>
  <text class="ok" x="40" y="336">改写：<tspan fill="#e6edf3">LIMIT 20 OFFSET 10</tspan></text>

  <text class="blocker" x="24" y="364">BLOCKER</text>
  <text class="dim" x="98" y="364">R001  IFNULL 在 Kingbase 中无对应函数</text>
  <text class="out" x="40" y="384">命中：<tspan fill="#e6edf3">ifnull(a.owner_name, 'unknown')</tspan>　改写：<tspan fill="#7ee787">COALESCE(a.owner_name, 'unknown')</tspan></text>
</svg>
